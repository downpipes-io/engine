# DEV deploy config — one of the owner-run instance environments (ENVIRONMENTS-ARCHITECTURE.md):
# the integration surface: deploys straight from origin/main.
# SAME Cloudflare account as the other owner surfaces. The engine has NO public route; the dev console
# reaches it over the ENGINE service binding, so Cloudflare Access on the console hostname gates everything.
# Native auth inside (ADMIN_TOKEN bootstrap -> passkey), exactly like a customer install. NO DEMO_MODE:
# this is a real instance, the demo reset surface must not exist here.
#
# FIRST deploy:  npx wrangler deploy -c wrangler.dev.toml   (worker does not exist yet: nothing to preserve)
# EVERY LATER deploy MUST preserve console-attached sources: generate wrangler.dev.deploy.toml =
# this file + every live SRC_* binding (read them via `npx wrangler versions view <id> --name downpipe-engine-dev`
# or the sync-bindings reconcile with an API token), then deploy -c that generated file. A bare deploy
# of THIS file would drop every attached source (the source-binding-drift behaviour).
name = "downpipe-engine-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = false
upload_source_maps = true

[vars]
CONSOLE_ORIGIN = "https://dev.downpipes.io"
# The in-product source attach rewrites the bindings of THIS worker name; it must never target another
# environment's engine (or prod "downpipe-engine").
WORKER_NAME = "downpipe-engine-dev"
# The dev console's script name: a console component applied from this engine deploys onto the dev
# console and never another environment's.
CONSOLE_WORKER_NAME = "downpipe-console-dev"
# CF_ACCOUNT_ID (optional, see wrangler.toml's own note): SAME Cloudflare account as the other
# owner surfaces, and one of several a single-account discovery token cannot resolve automatically,
# so this environment needs it set explicitly. Not committed here, so a public repository carries
# no account id; supply it at deploy time instead, e.g.
#   npx wrangler deploy -c wrangler.dev.toml --var CF_ACCOUNT_ID:<your-account-id>
# CF_ACCOUNT_ID = "your-account-id"
EMAIL_FROM = "no-reply@downpipes.io"
# UPDATE_CHANNEL_URL is deliberately NOT set here for this environment. This env follows the
# INTERNAL (pre-release) channel, whose manifest lives at an UNGUESSABLE URL so pre-release builds
# never sit at a public name a customer could fetch and manually apply
# (ENVIRONMENTS-ARCHITECTURE.md section 5). The URL is installed as a per-worker SECRET
# (survives config deploys, stays out of git and version listings):
#   npx wrangler secret put UPDATE_CHANNEL_URL --name downpipe-engine-dev
# The current URL is recorded in this environment's key-kit folder (internal-channel-url.txt).
