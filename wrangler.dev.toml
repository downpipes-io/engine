[[send_email]]
name = "EMAIL"
remote = true

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "SchedulerDO"

[[durable_objects.bindings]]
name = "RUNSEAL"
class_name = "RunSealDO"

[[durable_objects.bindings]]
name = "RATELIMIT_DO"
class_name = "RateLimitDO"

# version_metadata (W1 provenance): the safe-apply self-check confirms the live version id matches the
# just-promoted one — required on UAT/INTERNAL where updates arrive through the channel.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SchedulerDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RunSealDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDO"]

[limits]
cpu_ms = 300000

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

# SOURCE BINDINGS — none live here, by design (same rule as the stock wrangler.toml): every source is
# attached from the console and preserved at deploy time by the generated superset config, never pinned
# here where it would survive while others drop.
