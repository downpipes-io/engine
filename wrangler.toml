# LICENCE_TOKEN is intentionally NOT set here: customers activate from the console (DO-stored, and the
# DO-stored token wins over this var). It stays readable only as an optional IaC fallback.

# Outbound email: the Cloudflare Email Service send binding (dash: Compute > Email
# Service > Email Sending). PREREQUISITES the deployer completes once in the dash:
# enable Email Service and onboard the EMAIL_FROM domain for sending (Cloudflare DNS
# required; MX/SPF/DKIM/DMARC records are added automatically). Until then every send
# is a clean, logged no-op whose error CODE names the gap
# (E_SENDER_DOMAIN_NOT_AVAILABLE / E_SENDER_NOT_VERIFIED).
#
# NOT remote. It carried remote = true, which is a `wrangler dev` convenience that lets
# local development send real mail; deploys ignore it, because a deployed Worker always gets the real
# binding. But vitest-pool-workers reads this file to build the test environment, saw the remote
# binding and tried to open a real remote dev session, which needs Cloudflare credentials. On a
# developer machine that silently succeeds from wrangler's cached login; on a runner there are no
# credentials, so the gating Runtime job failed with "Could not start remote dev session. No
# credentials found, and the environment is non-interactive". A dev-time convenience is not worth a
# gating job that cannot run. A developer who wants real mail can pass `wrangler dev --remote`.
[[send_email]]
name = "EMAIL"

# Cloudflare Access (the higher-assurance admin auth) onboarding knobs; the code already reads both
# (see src/admin/auth.ts). Set the team domain and the Access application AUD tag to require a
# verified Access JWT; leave commented to use the ADMIN_TOKEN bearer fallback.
# CF_ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# CF_ACCESS_AUD = "your-access-application-aud-tag"

# The scheduler Durable Object that owns schedules, the run lock and the RUNLOG index.
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "SchedulerDO"

# The per-downpipe seal Durable Object: a run too large for one invocation's
# subrequest/CPU budget continues here as alarm-chained slices (fresh platform budget per
# alarm) until it finalises. Small runs complete inline and never touch it. The optional
# vars SCALE_SLICE_SUBREQUESTS / SCALE_SLICE_WALL_MS / SCALE_SHARD_MAX_RECORDS /
# SCALE_SEGMENT_TARGET_BYTES tune it; SLICED_RUNS_DISABLED reverts to the v1 whole-run
# seal (see src/env.d.ts and docs/OPERATIONS.md "Large environments").
[[durable_objects.bindings]]
name = "RUNSEAL"
class_name = "RunSealDO"

# The account-global CF API rate-limit Durable Object (the shared token bucket DistributedPacer fronts):
# every CF account-API crawl draws a token from ONE bucket here, so concurrent crawls are paced in aggregate
# below the account ~1200 req/5min limit, not just per-isolate (see src/sched/ratelimit-do.ts). It is
# OPTIONAL/additive: accountPacer (src/cf-pace.ts) falls back to the per-isolate CfPacer when this binding is
# absent. The binding is drafted; its live cross-isolate go-live is a deliberate later step.
[[durable_objects.bindings]]
name = "RATELIMIT_DO"
class_name = "RateLimitDO"

# version_metadata (W1 provenance): exposes the deployed Worker version's immutable identity
# { id, tag, timestamp } at runtime, so the engine self-reports which Cloudflare version it is (GET
# /admin/status) and the safe-apply self-check can confirm the live version id matches the just-promoted
# one. It is already in cf-deploy.ts's RESENDABLE_TYPES, so a self-deploy preserves it (no brick-guard
# trip). No cost; config-only. See src/env.d.ts (CF_VERSION_METADATA).
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SchedulerDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RunSealDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDO"]

# Raise the per-invocation CPU ceiling (Workers paid; config-only, no extra cost until
# used): sealing hashes and encrypts every byte it reads, so a slice that streams
# hundreds of megabytes (or a chained >1 GiB object's windows) needs more than the 30 s
# default.
[limits]
cpu_ms = 300000

# Workers observability: ship invocation logs and metrics to the Cloudflare dashboard so a
# self-hosting operator can see scheduler runs, seal failures and rate-limit events without
# wiring an external sink. Config-only and no extra cost until logs accrue.
[observability]
enabled = true

# The dispatch driver for new runs (the scheduler alarm currently only re-arms;
# precise alarm-driven dispatch is a deferred refinement). Seal DO alarms carry
# already-started large runs between ticks.
[triggers]
crons = ["*/15 * * * *"]

# Outbound email senders (contract section 3): the EMAIL binding is declared once above (line 81). The
# notification channel, the expiry alerts (src/email.ts), and the role-invite notification
# (src/admin/router.ts) all send through it. Until the EMAIL_FROM domain is onboarded in the dashboard
# (the prerequisites noted at the binding above), sendEmail is honestly fail-open ({ ok:false,
# reason:"email-not-configured" }): notifications simply skip the email channel and a role-invite is
# silently skipped, so an unbound or un-onboarded account never has a send block or fail a grant.
# EMAIL_FROM is the sender for the notification/expiry channels, validated as a custom-domain address at
# send time (never *.workers.dev). INVITE_EMAIL_FROM is the SEPARATE, opt-in sender for the role-invite
# email sent when a role is granted to a person via POST /admin/roles: the invite is OFF unless
# INVITE_EMAIL_FROM is set, so an account can run alerts/expiry email without emailing on every role
# grant (or vice versa). A send failure never blocks or fails the grant. Set both as vars to enable:
# [vars] (append): EMAIL_FROM = "alerts@your-custom-domain.example"
# [vars] (append): INVITE_EMAIL_FROM = "invites@your-custom-domain.example"
# CONSOLE_ORIGIN supplies the sign-in link the invite points at.

# THE ARCHIVE DESTINATION. Where your backups are written.
#
# NOTHING HERE IS REQUIRED, AND THAT IS WHY THIS BLOCK EXISTS. The ordinary path is the console's
# Destinations screen, which verifies the destination live before it stores it, gates it on Owner and
# audits it; a destination set there WINS over everything below, exactly as a console-set discovery token
# wins over DISCOVERY_API_TOKEN (src/dest/factory.ts, RuntimeDestConfig / fetchDestConfig).
#
# The block is here because a customer following the published deploy is told, at the moment of doing it,
# to "set your destination in wrangler.toml", and then opens a file that says nothing about destinations
# at all: no binding, no var, not even a commented placeholder. The
# instruction was not wrong, the file was silent, and a file that is generous with placeholders everywhere
# else reads as "there is nothing here to set" rather than as an omission.
#
# TWO WRITERS, and DEST_KIND chooses between them when both could apply.
#
# R2, in this account. No credentials on the wire: the bucket is a binding.
# [[r2_buckets]]
# binding = "DEST_R2"
# bucket_name = "your-archive-bucket"
#
# S3-compatible, anywhere else. The endpoint, bucket and region are vars; the two keys are NOT, and must
# never be written here. They are read from the Secrets Store via a binding, like every other secret this
# engine holds.
# [vars] (append): DEST_KIND = "s3"
# [vars] (append): DEST_ENDPOINT = "https://s3.your-provider.example"
# [vars] (append): DEST_BUCKET = "your-archive-bucket"
# [vars] (append): DEST_REGION = "auto"
#
# DEST_KIND forces the choice: "r2" uses the DEST_R2 binding, "s3" uses the HTTP path. Absent, a bound
# DEST_R2 is the default. See src/dest/factory.ts.

# SOURCE BINDINGS — NONE live here, by design (READ THIS before editing).
# A backup SOURCE is a Workers binding (KV / R2 / D1 / Secrets Store). EVERY source is attached from
# the CONSOLE (Sources screen): the engine adds the binding to its own LIVE worker via the Cloudflare
# API and proves the change drops nothing (src/admin/attach.ts) — no CLI, and it never edits this
# file. This file therefore lists NO source bindings, on purpose: pinning one here would make that
# one survive a `wrangler deploy` while every other source is dropped — the exact inconsistency we
# refuse. Every source is treated identically.
#
# `wrangler deploy` REPLACES the worker's bindings with exactly what THIS file lists, so the ONLY
# safe way to deploy is `npm run deploy`, which runs scripts/sync-bindings.mjs to read the LIVE
# worker's bindings and deploy a SUPERSET (wrangler.deploy.toml = this file + EVERY live source),
# carrying them all uniformly, and which STOPS rather than ship a binding-dropping config.
#
# A CLOUDFLARE API TOKEN IS OPTIONAL. An authenticated `wrangler login` session is enough for
# `npm run deploy` to read the live bindings via scripts/sync-bindings.mjs; CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID are the alternative for an environment with no such session (CI, a machine you
# cannot log in on).
#
# The Sources screen and the preflight "Source bindings" check surface any
# binding that has gone missing. (Recipient public keys and the signer key are read from the Secrets
# Store via a binding, never hard-coded.)
