# The engine deploys into the CUSTOMER's own Cloudflare account. It is reached on a
# custom domain only; the workers.dev route is disabled by policy (no *.workers.dev).
# The bindings below are placeholders the customer fills in at onboarding.
name = "downpipe-engine"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = false
# Upload source maps with the bundle so a stack trace in a thrown error maps back to the
# original TypeScript rather than the minified output. Aids self-hosted debugging; the maps
# stay in the customer's own account.
upload_source_maps = true

# DEFAULT TOPOLOGY: the engine has NO public hostname. The console reaches it over a
# worker-to-worker service binding and proxies /admin/* and /support/* same-origin, so
# the only public surface is the console's domain; cron triggers and Durable Objects
# run without any route. SPLIT topology (uncomment to give the engine its own custom
# domain, never *.workers.dev) exists for deployments that front the two surfaces
# differently (e.g. separate Access policies per hostname):
# route = { pattern = "engine.example.com", custom_domain = true }

# The in-account console origin allowlisted for CORS.
[vars]
CONSOLE_ORIGIN = "https://console.downpipes.io"
# RENAMING THE ENGINE WORKER TOUCHES THREE PLACES, NOT ONE, AND THIS IS THE CHECKLIST.
# A cold operator following the published pages alone got two of the three wrong, and both mistakes
# are silent: nothing refuses, nothing warns, and the damage shows up later
# as a source attached to a worker nobody is running or a console that cannot reach its engine.
#   1. `name` at the top of THIS file. The obvious one.
#   2. `WORKER_NAME` immediately below. See its own paragraph.
#   3. `service = "downpipe-engine"` under `[[services]]` in the CONSOLE'S wrangler.toml, which is a
#      SEPARATE REPOSITORY. That binding is how the console reaches the engine at all, and it holds a
#      second hard-coded copy of this worker's name. Miss it and the console's own deploy is refused by
#      the Cloudflare API with "Service binding 'ENGINE' references Worker 'downpipe-engine' which was
#      not found [code: 10143]", which at least fails loudly, but names a worker you never asked for.
# And if you rename the CONSOLE, `CONSOLE_WORKER_NAME` below is the fourth copy, in the other direction.
#
# WORKER_NAME: the in-product source attach rewrites the bindings of THIS worker name
# (src/admin/router.ts reads env.WORKER_NAME ?? "downpipe-engine"). The default is safe only
# because the fallback string equals the "name" above. If you rename the worker in this file,
# SET WORKER_NAME to the same value, or the attach would silently target "downpipe-engine"
# rather than your renamed worker. That one does NOT fail loudly, which is what makes it the worst of
# the three: the attach succeeds against a worker that is not yours. Uncomment and align if you rename.
# WORKER_NAME = "downpipe-engine"
# CONSOLE_WORKER_NAME: the CONSOLE's script name, the twin of WORKER_NAME for the multi-component
# update path (POST /admin/update/apply with a console component deploys onto THIS script and no
# other -- the deploy-target guarantee, since a Cloudflare token cannot be scoped to script names).
# Optional; defaults to "downpipe-console" (the console's wrangler.toml name). Uncomment and align
# ONLY if you rename the console worker, or a console update would target the wrong script.
# CONSOLE_WORKER_NAME = "downpipe-console"
# CF_ACCOUNT_ID (optional): the engine's OWN Cloudflare account id. The no-CLI key install and the
# source-attach (POST /keys/install, /sources/attach) must name the engine's own account to PUT to it.
# They resolve it from the console-marked account, then this var, then -- the fresh self-host case -- a
# read-only discovery token that sees EXACTLY ONE account. SET THIS only when the engine's account is one
# of SEVERAL the discovery token can see (otherwise a single-account token resolves it automatically, so
# the first-run key install never dead-ends to the command line). Left unset by default.
# CF_ACCOUNT_ID = "your-account-id"
# The sender for outbound engine email (alerts, expiry, role invites, the first-Owner
# set-up link). Must be an address on a domain onboarded for Cloudflare Email Sending;
# until then every send is a clean, logged no-op (fail-open).
EMAIL_FROM = "no-reply@downpipes.io"
# BOOTSTRAP_OWNER_EMAIL (the email-link first-run, POST /admin/auth/bootstrap/send) is
# set per deployment, not committed: npx wrangler secret put BOOTSTRAP_OWNER_EMAIL

# ---- Assurance licence + free updates (activation) ------------------------------------------------
# Customers ACTIVATE their licence FROM THE CONSOLE (Licence > Activate): the token is verified live
# against the pinned signer and stored at RUNTIME in the scheduler DO — no CLI, no redeploy. The
# DO-stored token wins over the deploy-time LICENCE_TOKEN below, exactly as the console-set destination
# wins over the env destination. The values here are the VENDOR PINS the verify path checks against:
# PUBLIC keys / a URL, never secrets, the SAME for every customer. Until they are pinned (a one-time
# vendor ceremony) GET /admin/licence and GET /admin/updates report fail-open "community" / "not
# configured" — which is correct and harmless (a licence and updates are never required).
#
# UPDATE_CHANNEL_URL is the vendor-hosted, signature-pinned version channel the engine PULLS (never a
# push) and verifies against UPDATE_SIGNER_PUBLIC. A plain URL, not a secret. It is static signed
# content (the engine trusts the PINNED SIGNATURE, not the host), so it is served as two static files
# from an R2 public bucket on the update.downpipes.io custom domain (O-1: singular "update") — no
# worker, no billing coupling. The engine fetches this URL for the channel body and this URL + ".sig"
# for the detached signature. The channel is "not set" until the owner runs the signer ceremony below
# (pins UPDATE_SIGNER_PUBLIC) and stands up the host; until then GET /admin/updates honestly reports
# configured:false and the console shows a "configure the channel" posture (no crash).
UPDATE_CHANNEL_URL = "https://update.downpipes.io/stable.json"
