# Mutation testing (StrykerJS) over the crypto/format byte and serialisation modules. A full
# mutation run is slow (about 8 minutes locally, longer on a CI runner), so this is a SCHEDULED
# gating job rather than a per-pull-request gate: it runs weekly and on demand, and FAILS when the
# mutation score drops below the stryker.config.json break threshold (75 per cent; measured 79.95
# per cent on 2026-06-22). That keeps the crypto mutation gate enforced without adding minutes to
# every pull request. The break threshold is the project standard of 90 per cent (high 95). The
# score measured 79.95 per cent on 2026-06-22, BELOW 90, so this scheduled run fails until the
# surviving crypto/format mutants are killed to raise the score to the standard.
name: Mutation

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  mutation:
    name: StrykerJS (crypto/format, fails below break threshold)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - name: stryker run (fails below the break threshold)
        run: npm run test:mutation
