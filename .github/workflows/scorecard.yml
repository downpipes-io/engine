# OpenSSF Scorecard supply-chain health check. Runs weekly (and on pushes to main), publishes
# the results to the Scorecard dashboard and uploads SARIF to code scanning. The badge in
# README.md reflects the latest score. Advisory: it does not gate merge.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Sundays at 19:30 UTC, early Monday morning in Melbourne.
    - cron: "30 19 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # OSSF Scorecard scores PUBLIC supply chains. On a private repo its action cannot even check the code
    # out ("Repository not found"), and it had failed every run since it was added. A permanently red
    # workflow is worse than none: it teaches the reader that red here means nothing, which is the last
    # thing to teach about a security job. It SKIPS while private and starts running by itself if the
    # repo is ever made public. No token and no settings change either way.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        # Code scanning cannot accept an upload on a private repository (an owner decision: no GHAS
        # there), so the step runs only where it can land. The public export runs it.
        if: ${{ github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
