# OpenSSF Scorecard supply-chain health check. Runs weekly (and on pushes to main), publishes
# the results to the Scorecard dashboard and uploads SARIF to code scanning. The badge in
# README.md reflects the latest score. Advisory: it does not gate merge.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Mondays at 07:30 UTC.
    - cron: "30 7 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # OSSF Scorecard scores PUBLIC supply chains. On a private repo its action cannot even check the code
    # out ("Repository not found"), and it had failed every run since it was added. A permanently red
    # workflow is worse than none: it teaches the reader that red here means nothing, which is the last
    # thing to teach about a security job. It SKIPS while private and starts running by itself if the
    # repo is ever made public. No token and no settings change either way.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with: { egress-policy: audit }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: results.sarif
