# Tag-triggered ATTESTED release artefacts for the engine (DP-A). This workflow is the CI half of
# the dual-root release model: it BUILDS deterministically and ATTESTS publicly; it never signs
# the update channel (the offline hybrid release key does that, at the owner's desk, and
# tools/publish-channel.mjs --from-release REFUSES bytes this workflow did not attest). CI holds
# no Cloudflare credential and no signing key; the only signatures minted here are keyless
# (Sigstore Fulcio, logged to the public Rekor transparency log, identity = this workflow).
#
# Chain per tag vX.Y.Z:
#   verify-tag  -> the tag's signature must verify against .github/allowed_signers AS COMMITTED ON
#                  main (never the tag's own tree, or a pushed tag could vouch for itself); the
#                  tag must also equal package.json's version, so a channel can never name bytes
#                  built from a different version than the tag says.
#   build       -> scripts/build-release.mjs (the deterministic unstamped bundle; see that script's
#                  header for why unstamped), one canonical SHA256SUMS.txt, release-facts.json
#                  (sha256 + the channel's sha384), CycloneDX SBOM from the same commit.
#   sign        -> cosign sign-blob (keyless, Rekor-logged) over every release file, then verified
#                  under this workflow's own identity before anything is published.
#   provenance  -> SLSA Build L3 provenance via the slsa-github-generator reusable workflow with
#                  the artefact digests as subjects. PINNING EXCEPTION (recorded): the generator
#                  MUST be called by tag, not commit SHA; its verifier refuses otherwise. This is
#                  the one deliberate deviation from the org's SHA-pin standard.
#   release     -> a GitHub release carrying artefact + sums + SBOM + cosign bundles + .intoto.jsonl,
#                  the exact set publish-channel --from-release ingests and republishes on the
#                  update channel (customers verify from the channel, never needing GitHub).
#
# The reproducibility-check workflow is the standing proof behind the word "deterministic";
# VERIFY.md's third-party rebuild instructions stand only while it is green.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify-tag:
    name: Verify the release tag signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify the tag against the signer roster committed on main
        # The roster is read from origin/main, NEVER from the tag's own tree: a pushed tag that
        # bundles its own allowed_signers must not be able to vouch for itself. Adding or rotating
        # a release-signing key is therefore a reviewed main-branch change. SSH-signed tags
        # (git tag -s with gpg.format=ssh) verify here; a GPG-signed tag needs the public key
        # imported instead. Swap the verify line if the owner signs with GPG; never delete the gate.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The checkout above is a full one (fetch-depth 0), so origin/main is already here; a
          # second fetch would need credentials the checkout deliberately does not persist
          # (persist-credentials false), and on a private repository it fails with "could not
          # read Username", which is what stopped the first attested cut.
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main is missing from the checkout; the roster cannot be read"; exit 1; }
          git show origin/main:.github/allowed_signers > "${RUNNER_TEMP}/allowed_signers"
          if ! grep -qE '^[^#[:space:]]' "${RUNNER_TEMP}/allowed_signers"; then
            echo "::error::.github/allowed_signers on main carries no signer entries yet; add the release-signing SSH public key (see the comment at the top of that file) before cutting an attested release."
            exit 1
          fi
          git -c gpg.ssh.allowedSignersFile="${RUNNER_TEMP}/allowed_signers" verify-tag "$TAG"
          echo "tag $TAG verified against the main-branch signer roster"
      - name: Tag must equal the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG; a channel must never name bytes built from a different version than the tag says."
            exit 1
          fi

  build:
    name: Deterministic build + SBOM
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.facts.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - name: Build the release artefact (deterministic, unstamped)
        id: facts
        run: |
          set -euo pipefail
          node scripts/build-release.mjs > release-facts.json
          cat release-facts.json
          echo "version=$(node -p "require('./release-facts.json').version")" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM (runtime deps)
        run: bash scripts/generate-sbom.sh
      - name: Canonical sums manifest
        # ONE canonical SHA256SUMS.txt (the provii WS-D lesson: never several checksum spellings).
        # The channel's gating sha384 lives in release-facts.json, itself listed and so attested.
        env:
          VERSION: ${{ steps.facts.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "dist/engine-${VERSION}.mjs" release-facts.json sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Export subject hashes for SLSA
        id: hash
        run: echo "hashes=$(base64 -w0 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload the release tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-release-${{ steps.facts.outputs.version }}
          path: |
            dist/engine-${{ steps.facts.outputs.version }}.mjs
            release-facts.json
            sbom.cdx.json
            SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

  sign:
    name: Cosign keyless signatures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Fulcio keyless identity for THIS workflow; every signature lands in Rekor
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "engine-release-${{ needs.build.outputs.version }}" }
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned: the installer's default cosign moved from 2 to 3 with v4 and changed sign-blob's
          # output form under the downpipe release; a release tool never floats here.
          cosign-release: v3.1.3
      - name: Sign every release file, then verify what was minted
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for f in "dist/engine-${VERSION}.mjs" SHA256SUMS.txt release-facts.json sbom.cdx.json; do
            cosign sign-blob --yes --bundle "$(basename "$f").cosign-bundle" "$f"
          done
          # A bundle that does not verify under this workflow's own identity must never be
          # published: the ceremony downstream pins exactly this identity regexp.
          for f in "dist/engine-${VERSION}.mjs" SHA256SUMS.txt release-facts.json sbom.cdx.json; do
            cosign verify-blob --bundle "$(basename "$f").cosign-bundle" \
              --certificate-identity-regexp "^https://github.com/downpipes-io/engine/\.github/workflows/release\.yml@refs/tags/v" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
      - name: Upload cosign bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-cosign-${{ needs.build.outputs.version }}
          path: "*.cosign-bundle"
          retention-days: 90
          if-no-files-found: error

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write # the generator can upload provenance to a release; assets are attached below
    # PINNING EXCEPTION (recorded): the SLSA generator must be pinned by TAG, not commit SHA; the
    # slsa-verifier refuses provenance minted from a SHA-pinned generator ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false # the release job attaches the whole set in one place
      provenance-name: engine.intoto.jsonl

  release:
    name: GitHub release
    needs: [build, sign, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach assets
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "engine-release-${{ needs.build.outputs.version }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "engine-cosign-${{ needs.build.outputs.version }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "engine.intoto.jsonl" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, path: source }
      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > verify.md <<'VERIFY'
          Attested release artefacts for the update channel. Verify locally: cosign verify-blob --bundle <file>.cosign-bundle <file>; slsa-verifier verify-artifact dist/engine-${VERSION}.mjs --provenance-path engine.intoto.jsonl --source-uri github.com/downpipes-io/engine. The owner ceremony republishes this whole set at update.downpipes.io/provenance/${VERSION}/ so customers verify from the channel without GitHub access.
          VERIFY
          # The release page shows the tagged CHANGELOG.md section for this version (release playbook,
          # section 7), with the verification instructions under it. A tag whose changelog has no section
          # for its version does not get a release: the version-bump PR is where the section is written.
          awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]"{f=1; next} f && /^## \[/{exit} f' source/CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::source/CHANGELOG.md has no section for ${VERSION}; the version-bump PR must add it before the tag."
            exit 1
          fi
          {
            echo "## What changed"
            cat section.md
            echo
            echo "## Verify this release"
            echo
            cat verify.md
          } > release-notes.md
      - name: Create the release with the full verification set
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "engine $TAG" \
            --notes-file release-notes.md \
            "dist/engine-${VERSION}.mjs" release-facts.json sbom.cdx.json SHA256SUMS.txt *.cosign-bundle engine.intoto.jsonl
