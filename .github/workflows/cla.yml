name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    permissions:
      # Signatures are stored on the cla-signatures branch in this same repository, so
      # contents: write is required (the README's "Configure Contributor License Agreement
      # within two minutes" section says contents can be 'read' only when signatures live in a
      # remote repository, which is not our case). actions: write is required for same-repo
      # storage too, per the same section's workflow file: without it the action fails after
      # signature checks pass, with "Resource not accessible by integration".
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/downpipes-io/engine/blob/main/CLA.md
          branch: cla-signatures
          allowlist: tim-maelstrom
          custom-notsigned-prcomment: Thank you for the contribution. Please read and sign the [Contributor Licence Agreement](https://github.com/downpipes-io/engine/blob/main/CLA.md) before this pull request can be reviewed. Comment "I have read the CLA Document and I hereby sign the CLA" below to sign.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
